<style>
:root{font-family:Arial,Helvetica,sans-serif;color:#1b2b33;background:#fbfbf4;font-synthesis:none;--ink:#1b2b33;--yellow:#f9cf2e;--cyan:#26c0e2;--pink:#f4a6c9}*{box-sizing:border-box}body{margin:0;border-top:8px solid var(--yellow)}button,a{-webkit-tap-highlight-color:transparent}button{font:inherit;color:inherit;cursor:pointer}button:disabled{cursor:wait;opacity:.55}button:focus-visible,a:focus-visible{outline:3px solid #087b91;outline-offset:5px}main{max-width:1020px;margin:auto;padding:32px 34px 24px}header{display:flex;justify-content:space-between;align-items:center;gap:20px;border-bottom:2px solid var(--ink);padding-bottom:24px}.brand{color:var(--ink);font-size:27px;font-weight:950;letter-spacing:-1.5px;text-decoration:none;display:flex;align-items:center}.brand span{color:#087b91}.brand i{color:var(--ink);font-style:normal;font-size:36px;line-height:1;margin-left:10px}.event-tag{font-size:12px;letter-spacing:1.3px;font-weight:800}.intro{padding:38px 0 30px}.eyebrow{font-size:13px;font-weight:800;letter-spacing:1.5px;display:flex;align-items:center;gap:8px}.tiny-star{font-size:23px;color:#087b91}h1{font-size:clamp(40px,6vw,68px);line-height:1.02;font-weight:950;letter-spacing:-3px;margin:14px 0 16px}h1 span{display:inline-block;background:var(--yellow);padding:3px 11px 6px;transform:rotate(-1deg)}.intro>p{font-size:19px;line-height:1.5;margin:0;color:#52636a}.vote-panel,.results-panel{border:2px solid var(--ink);background:#fff;box-shadow:7px 7px 0 var(--ink)}.panel-top{padding:25px 28px 23px;border-bottom:2px solid var(--ink);background:#e8f8fc}h2{margin:0;font-size:26px;line-height:1.2;font-weight:900;letter-spacing:-.7px}.panel-top p{font-size:16px;line-height:1.5;color:#52636a;margin:10px 0 0}.team-options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px;padding:28px}.team-option{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;border:2px solid var(--ink);background:#fff;min-height:168px;box-shadow:3px 3px 0 var(--ink);transition:transform .12s,background .12s}.team-option:hover:enabled{background:var(--yellow);transform:translate(-1px,-2px)}.team-option:nth-child(even):hover:enabled{background:var(--cyan)}.team-option.selected{background:var(--yellow)}.team-label{font-size:14px;letter-spacing:1.6px;font-weight:800}.team-option strong{font-size:56px;line-height:1;font-weight:950;letter-spacing:-2px}.vote-label{font-size:12px;font-weight:800;letter-spacing:.8px;margin-top:7px}.panel-foot{display:flex;align-items:center;justify-content:space-between;gap:18px;border-top:1px solid #dce2e1;padding:18px 28px;font-size:13px;line-height:1.5;color:#52636a}.text-button{background:transparent;padding:6px 0;border:0;font-size:14px;font-weight:800;color:var(--ink);text-decoration:underline;text-underline-offset:4px;white-space:nowrap}.text-button span{display:inline-block;margin-left:5px}.voted-banner{display:flex;gap:14px;align-items:center;padding:20px 26px;background:#fff5c8;border-bottom:2px solid var(--ink)}.check{display:grid;place-items:center;width:34px;height:34px;flex-shrink:0;border:2px solid var(--ink);background:var(--yellow);font-size:20px;font-weight:900}.voted-banner p{font-size:13px;line-height:1.5;font-weight:700;margin:0;flex:1}.voted-banner p strong{font-size:17px}.voted-banner p span{display:block;font-size:14px;font-weight:400;color:#52636a;margin-top:3px}.results-head{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:25px 28px;background:#e8f8fc;border-bottom:2px solid var(--ink)}.title-with-icon{display:flex;gap:14px;align-items:center}.trophy{width:49px;height:49px;border:2px solid var(--ink);background:var(--cyan);display:grid;place-items:center}.trophy svg{width:34px;height:34px}.eyebrow.small{font-size:10px;letter-spacing:1px;margin-bottom:6px}.live{display:flex;gap:8px;align-items:center;font-size:11px;font-weight:800;letter-spacing:1.2px}.live>span{width:8px;height:8px;border-radius:50%;background:#098379;box-shadow:0 0 0 4px #09837913}.board-summary{display:flex;justify-content:space-between;gap:14px;padding:20px 28px 10px;align-items:center}.board-summary p{margin:0;font-size:15px}.board-summary strong{font-size:26px;font-weight:900}.board-summary>span{font-size:12px;color:#52636a}.empty{margin:10px 28px 0;font-size:15px;color:#52636a;line-height:1.5}.leaderboard{margin:0;padding:0 28px;list-style:none}.leaderboard li{display:flex;align-items:center;gap:17px;border-bottom:1px solid #e1e6e5;padding:21px 0}.leaderboard li:last-child{border-bottom:0}.rank{display:grid;place-items:center;width:36px;height:36px;flex-shrink:0;font-size:20px;font-weight:800;border:2px solid #d8e1e2;background:#fbfbf4}.leading .rank{border-color:var(--ink);background:var(--yellow);box-shadow:2px 2px 0 var(--ink)}.team-result{flex:1;min-width:0}.result-line{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:10px}.team-name{font-size:20px;font-weight:850;display:flex;align-items:center;flex-wrap:wrap;gap:9px}.pick-badge{font-size:9px;letter-spacing:.4px;border:1px solid var(--ink);padding:3px 5px;background:#fce7f1}.tie{font-size:9px;letter-spacing:.7px;font-weight:700;color:#52636a}.vote-count{display:flex;align-items:baseline;gap:8px;white-space:nowrap}.vote-count strong{font-size:24px;font-weight:900;min-width:15px;text-align:right}.vote-count>span{font-size:12px;color:#52636a}.bar-track{height:10px;width:100%;background:#edf1f0;overflow:hidden}.bar-fill{height:100%;background:var(--cyan);transition:width .45s ease}.leading .bar-fill{background:var(--yellow)}.results-foot{border-top:2px solid var(--ink);padding:17px 28px;display:flex;justify-content:space-between;align-items:center;gap:15px;background:#fbfcf8}.results-foot>span{font-size:12px;line-height:1.5;color:#52636a}.results-foot>div{display:flex;align-items:center;gap:20px}.small-button{border:2px solid var(--ink);padding:10px 13px;background:var(--yellow);font-size:13px;font-weight:800;white-space:nowrap}footer{display:flex;justify-content:space-between;gap:16px;padding-top:30px;font-size:10px;letter-spacing:1px;line-height:1.5;color:#52636a}footer strong{color:var(--ink)}.error{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:15px 18px;border:2px solid var(--ink);background:#fce7f1;margin-bottom:20px;font-size:15px}.error button{border:0;background:transparent;text-decoration:underline;font-weight:800;white-space:nowrap}@media(max-width:650px){main{padding:24px 18px}.event-tag{font-size:9px;max-width:110px;text-align:right;line-height:1.5}.brand{font-size:24px}.intro{padding:30px 0 24px}h1{font-size:42px;letter-spacing:-2px}.intro>p{font-size:17px}.panel-top{padding:23px 20px}h2{font-size:23px}.team-options{padding:20px;gap:11px;grid-template-columns:repeat(3,minmax(0,1fr))}.team-option{min-height:125px}.team-option strong{font-size:43px}.vote-label{font-size:10px}.team-label{font-size:12px}.panel-foot{padding:17px 20px;align-items:flex-start;flex-direction:column;gap:8px}.results-head{padding:22px 20px}.title-with-icon{gap:10px}.trophy{width:40px;height:40px}.trophy svg{width:28px;height:28px}.results-head h2{font-size:23px}.live{font-size:9px;gap:6px;letter-spacing:.5px}.eyebrow.small{font-size:9px}.board-summary{padding:17px 20px 6px;align-items:flex-start}.board-summary>span{max-width:115px;text-align:right;line-height:1.5}.leaderboard{padding:0 20px}.leaderboard li{gap:12px;padding:19px 0}.team-name{font-size:18px;gap:6px}.vote-count{gap:5px}.vote-count strong{font-size:22px}.vote-count>span{font-size:10px}.rank{width:30px;height:30px;font-size:17px}.pick-badge{font-size:8px}.voted-banner{padding:17px 20px;flex-wrap:wrap}.voted-banner>.text-button{margin-left:48px;padding-top:0}.results-foot{padding:17px 20px;flex-wrap:wrap}.empty{margin-left:20px;margin-right:20px}footer{font-size:8px}.vote-panel,.results-panel{box-shadow:5px 5px 0 var(--ink)}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.team-label{max-width:100%;overflow-wrap:anywhere;text-align:center;padding:0 8px}.voted-banner p strong{text-transform:uppercase}.team-name{overflow-wrap:anywhere}
dialog{width:min(480px,calc(100vw - 32px));max-height:calc(100dvh - 32px);overflow:auto;padding:0;color:var(--ink);border:2px solid var(--ink);background:#fff;box-shadow:7px 7px 0 var(--ink)}dialog::backdrop{background:#1b2b33b3}dialog [hidden]{display:none!important}.settings-head{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 24px;background:#e8f8fc;border-bottom:2px solid var(--ink)}.settings-head h2{font-size:23px}.settings-close{width:44px;height:44px;margin:-6px -10px -6px 0;border:0;background:transparent;font-size:24px;line-height:1}.settings-section{margin:0;padding:20px 24px;border:0;border-bottom:1px solid #dce2e1}.settings-section:last-child{border-bottom:0}.settings-section h3{margin:0 0 12px;font-size:16px;font-weight:900}.settings-field{display:block;margin-bottom:12px;font-size:13px;font-weight:800}.settings-field input{display:block;width:100%;min-height:44px;margin-top:6px;padding:9px 11px;font:400 16px Arial,Helvetica,sans-serif;color:var(--ink);background:#fff;border:2px solid var(--ink);border-radius:0}.settings-field input:focus-visible,dialog button:focus-visible{outline:3px solid #087b91;outline-offset:2px}.settings-note{margin:0 0 14px;font-size:14px;line-height:1.5;color:#52636a}.settings-actions{display:flex;flex-wrap:wrap;align-items:center;gap:10px}.settings-actions button{min-height:44px}.settings-danger{border:2px solid var(--ink);padding:10px 13px;background:#fce7f1;font-size:13px;font-weight:800}.settings-danger.confirm{color:#fff;background:#a3123f}.settings-plain{border:0;padding:10px 13px;background:transparent;font-size:13px;font-weight:800;text-decoration:underline;text-underline-offset:4px}.settings-status{min-height:21px;margin:12px 0 0;font-size:14px;line-height:1.5;font-weight:700;color:#087b91}.settings-status.bad{color:#a3123f}
</style>

<body>
<main>
  <header><a class="brand" href="/fan-favorite" aria-label="FastForge fan favorite">FAST<span>FORGE</span><i aria-hidden="true">✳</i></a><span class="event-tag">THE AUDIENCE GETS A SAY</span></header>
  <section class="intro"><div class="eyebrow"><span class="tiny-star" aria-hidden="true">✦</span> THE PEOPLE’S PICK</div><h1>FAN <span>FAVORITE.</span></h1><p>Three teams. One crowd favorite. You decide.</p></section>
  <div id="poll"></div>
  <footer><span>BIG IDEAS. REAL BUILDS. <strong>YOUR FAVORITE.</strong></span><span>FASTFORGE FAN VOTE</span></footer>
</main>
<dialog id="settings" aria-labelledby="settings-title">
  <div class="settings-head"><h2 id="settings-title">Poll settings</h2><button type="button" class="settings-close" id="settings-close" aria-label="Close settings">×</button></div>
  <div class="settings-section">
    <label class="settings-field">Organizer passcode<input id="settings-passcode" type="password" autocomplete="off"></label>
    <p class="settings-note">Needed to save names or reset votes.</p>
    <p class="settings-status" id="settings-status" role="status"></p>
  </div>
  <form class="settings-section" id="settings-names">
    <h3>Team names</h3>
    <div id="settings-name-fields"></div>
    <div class="settings-actions"><button type="submit" class="small-button" id="settings-save">Save names</button></div>
  </form>
  <div class="settings-section">
    <h3>Reset votes</h3>
    <p class="settings-note" id="settings-reset-note"></p>
    <div class="settings-actions"><button type="button" class="settings-danger" id="settings-reset">Reset all votes</button><button type="button" class="settings-plain" id="settings-reset-cancel" hidden>Cancel</button></div>
  </div>
</dialog>
<script>
// Team names come from teams.json; scripts/build.mjs fills them in.
const TEAMS=/*TEAMS*/[];
const app=document.getElementById('poll');
const TROPHY='<svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M10 5h12v9a6 6 0 0 1-12 0V5Z" stroke="currentColor" stroke-width="2.4"/><path d="M10 8H5v4a6 6 0 0 0 6 6M22 8h5v4a6 6 0 0 1-6 6M16 20v6m-6 1h12" stroke="currentColor" stroke-width="2.4" stroke-linecap="square"/></svg>';
let poll={teams:TEAMS.map(({id,name})=>({team:id,name,votes:0,rank:null,percentage:0})),total:0,myVote:null};
let ready=false,saving=null,showResults=false,error='',updating=false;
let busy=false,token=null,revision=0,voteFailed=false,tick=0;

function esc(value){return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c])}
function teamName(id){return poll.teams.find(team=>team.team===id)?.name??'Team'}
// A reset clears this browser's vote, so send them back to the ballot.
function applyPoll(data){if(poll.myVote&&!data.myVote)showResults=false;poll=data}
function votingHeaders(){
  if(!token){try{token=localStorage.getItem('fastforge-fan-voter')}catch{}}
  if(!token||!/^[a-f0-9-]{36}$/.test(token)){token=crypto.randomUUID();try{localStorage.setItem('fastforge-fan-voter',token)}catch{}}
  return {'X-Fan-Voter':token};
}
function rememberVoter(data){if(data.voterToken){token=data.voterToken;try{localStorage.setItem('fastforge-fan-voter',data.voterToken)}catch{}}}
async function api(path,options,fallback){
  let response,data;
  try{response=await fetch(path,{cache:'no-store',credentials:'same-origin',...options});data=await response.json()}catch{throw new Error(fallback)}
  if(!response.ok)throw new Error(data.error||fallback);
  return data;
}

async function refresh(initial=false){
  if(busy)return;busy=true;updating=true;render();const version=revision;
  try{const data=await api('/api/poll',{headers:votingHeaders()},'Could not refresh the results. Please try again.');rememberVoter(data);if(version===revision)applyPoll(data);ready=true;if(initial&&data.myVote)showResults=true;if(!voteFailed)error='';}
  catch(e){if(!voteFailed)error=e.message;}
  finally{busy=false;updating=false;render();}
}
async function vote(team){
  if(!ready||saving!==null)return;revision++;saving=team;error='';voteFailed=false;render();
  try{const data=await api('/api/vote',{method:'POST',headers:{'Content-Type':'application/json',...votingHeaders()},body:JSON.stringify({team,voterToken:token})},'Could not save your vote. Please try again.');rememberVoter(data);poll=data;showResults=true;}
  catch(e){error=e.message;voteFailed=true;}
  finally{saving=null;render();}
}

function votePanel(){
  const locked=!ready||saving!==null?' disabled':'';
  return `<section class="vote-panel" aria-labelledby="vote-title"><div class="panel-top"><h2 id="vote-title">Which team did you like the most?</h2><p>Tap your favorite to cast your vote.</p></div><div class="team-options">${TEAMS.map(({id:team})=>{const name=teamName(team);return `<button type="button" class="team-option${poll.myVote===team?' selected':''}" data-vote="${team}"${locked} aria-label="Vote for ${esc(name)}" aria-pressed="${poll.myVote===team}"><span class="team-label">${name===`Team ${team}`?'TEAM':esc(name)}</span><strong>${team}</strong><span class="vote-label">${saving===team?'SAVING…':poll.myVote===team?'YOUR PICK ✓':'VOTE ↗'}</span></button>`}).join('')}</div><div class="panel-foot"><span>${ready?'One vote per browser. You can change your pick.':'Connecting to the poll…'}</span><button class="text-button" type="button" data-action="results"${locked}>View live results <span aria-hidden="true">↗</span></button></div></section>`;
}
function resultsPanel(){
  const banner=poll.myVote?`<div class="voted-banner" role="status"><div class="check" aria-hidden="true">✓</div><p>YOU PICKED <strong>${esc(teamName(poll.myVote))}.</strong><span>Your vote is in. Thanks for cheering them on!</span></p><button class="text-button" type="button" data-action="vote">Change vote</button></div>`:'';
  const rows=poll.teams.map((team,index)=>{
    const tied=team.votes>0&&poll.teams.filter(t=>t.votes===team.votes).length>1,mine=team.team===poll.myVote;
    return `<li class="${(index===0&&team.votes>0?'leading ':'')+(mine?'my-pick':'')}"><div class="rank" aria-label="${team.rank?`Rank ${team.rank}${tied?', tied':''}`:'No votes yet'}">${team.rank??'—'}</div><div class="team-result"><div class="result-line"><div class="team-name">${esc(team.name)}${mine?'<span class="pick-badge">YOUR PICK</span>':''}${tied?'<span class="tie">TIED</span>':''}</div><div class="vote-count"><strong>${team.votes.toLocaleString()}</strong><span>${team.votes===1?'vote':'votes'} · ${team.percentage}%</span></div></div><div class="bar-track"><div class="bar-fill" style="width:${team.percentage}%"></div></div></div></li>`;
  }).join('');
  return `<section class="results-panel" aria-labelledby="results-title">${banner}<div class="results-head"><div class="title-with-icon"><div class="trophy">${TROPHY}</div><div><div class="eyebrow small">THE CROWD HAS SPOKEN${poll.total===0?'…':' (SO FAR)'}</div><h2 id="results-title">Live leaderboard</h2></div></div><div class="live"><span aria-hidden="true"></span>${error?'RECONNECTING':'LIVE'}</div></div><div class="board-summary"><p><strong>${poll.total.toLocaleString()}</strong> ${poll.total===1?'vote':'votes'} cast</p><span>Updates automatically every 3 seconds</span></div>${poll.total===0?'<p class="empty">The crowd favorite is still up for grabs. Cast the first vote!</p>':''}<ol class="leaderboard" aria-label="Teams ranked by total votes">${rows}</ol><div class="results-foot"><span>Highest votes first. Tied teams share a rank.</span><div>${poll.myVote?'':'<button class="small-button" type="button" data-action="vote">Cast your vote ↗</button>'}<button class="text-button" type="button" data-action="refresh"${updating?' disabled':''}>Refresh <span aria-hidden="true">↻</span></button></div></div></section>`;
}

// Patch the page in place so focus, live regions and bar transitions survive each refresh.
function morph(node,next){
  if(node.isEqualNode(next))return;
  if(node.nodeType===3&&next.nodeType===3){node.nodeValue=next.nodeValue;return}
  if(node.nodeName!==next.nodeName||node.nodeType!==1){node.replaceWith(next);return}
  for(const {name} of [...node.attributes])if(!next.hasAttribute(name))node.removeAttribute(name);
  for(const {name,value} of [...next.attributes])if(node.getAttribute(name)!==value)node.setAttribute(name,value);
  const current=[...node.childNodes],incoming=[...next.childNodes];
  incoming.forEach((child,i)=>current[i]?morph(current[i],child):node.appendChild(child));
  current.slice(incoming.length).forEach(child=>child.remove());
}
function render(){
  const next=document.createElement('div');next.id='poll';
  next.innerHTML=(error?`<div class="error" role="alert"><span>${esc(error)}</span><button type="button" data-action="refresh"${updating?' disabled':''}>Try again</button></div>`:'')+(showResults?resultsPanel():votePanel());
  morph(app,next);
}

app.addEventListener('click',event=>{
  const button=event.target.closest('button');if(!button||button.disabled)return;
  if(button.dataset.vote)return void vote(Number(button.dataset.vote));
  const action=button.dataset.action;
  if(action==='results'){showResults=true;render()}
  else if(action==='vote'){showResults=false;render()}
  else if(action==='refresh'){voteFailed=false;void refresh()}
});
// The ballot polls less often than the leaderboard; it only needs to pick up renames and resets.
setInterval(()=>{tick++;if((showResults||tick%4===0)&&document.visibilityState==='visible')void refresh()},3000);

// Organizer settings popup: Cmd+Shift+U on Mac, Ctrl+Shift+U on Windows.
const settings=document.getElementById('settings'),passcodeInput=document.getElementById('settings-passcode'),settingsStatus=document.getElementById('settings-status'),nameFields=document.getElementById('settings-name-fields'),namesForm=document.getElementById('settings-names'),saveButton=document.getElementById('settings-save'),resetButton=document.getElementById('settings-reset'),resetCancel=document.getElementById('settings-reset-cancel'),resetNote=document.getElementById('settings-reset-note');
let confirmingReset=false,adminBusy=false;
nameFields.innerHTML=TEAMS.map(({id,name})=>`<label class="settings-field">Team ${id}<input type="text" data-team="${id}" maxlength="40" placeholder="${esc(name)}" autocomplete="off"></label>`).join('');
const nameInputs=[...nameFields.querySelectorAll('input')];
function defaultName(id){return TEAMS.find(team=>team.id===id)?.name}
function fillNames(){for(const input of nameInputs){const id=Number(input.dataset.team),name=teamName(id);input.value=name===defaultName(id)?'':name}}
function setStatus(message,bad=false){settingsStatus.textContent=message;settingsStatus.classList.toggle('bad',bad)}
function showReset(){
  const votes=poll.total.toLocaleString(),noun=poll.total===1?'vote':'votes';
  resetNote.textContent=confirmingReset?`This permanently deletes ${votes} ${noun} and can’t be undone.`:`Clears every vote so the crowd can vote again. Team names stay. Currently ${votes} ${noun}.`;
  resetButton.textContent=confirmingReset?'Yes, delete all votes':'Reset all votes';
  resetButton.classList.toggle('confirm',confirmingReset);resetCancel.hidden=!confirmingReset;
}
function setAdminBusy(value){adminBusy=value;for(const button of [saveButton,resetButton,resetCancel])button.disabled=value}
async function openSettings(){
  confirmingReset=false;setStatus('');fillNames();showReset();settings.showModal();passcodeInput.focus();
}
// Returns true once the server has applied the change.
async function adminRequest(body,fallback){
  if(adminBusy)return false;
  if(!passcodeInput.value){setStatus('Enter the organizer passcode first.',true);passcodeInput.focus();return false}
  if(!ready){setStatus('Still connecting to the poll. Please try again in a moment.',true);return false}
  setAdminBusy(true);setStatus('Saving…');revision++;
  try{
    const data=await api('/api/fan-admin',{method:'POST',headers:{'Content-Type':'application/json',...votingHeaders()},body:JSON.stringify({...body,passcode:passcodeInput.value})},fallback);
    rememberVoter(data);applyPoll(data);render();return true;
  }catch(e){setStatus(e.message,true);if(e.message==='Incorrect passcode.'){passcodeInput.select();passcodeInput.focus()}return false}
  finally{setAdminBusy(false)}
}
namesForm.addEventListener('submit',async event=>{
  event.preventDefault();
  const names=Object.fromEntries(nameInputs.map(input=>[input.dataset.team,input.value]));
  if(await adminRequest({action:'rename',names},'Could not save the names. Please try again.')){fillNames();showReset();setStatus('Team names saved.')}
});
resetButton.addEventListener('click',async()=>{
  if(!confirmingReset){
    if(!passcodeInput.value){setStatus('Enter the organizer passcode first.',true);passcodeInput.focus();return}
    confirmingReset=true;setStatus('');showReset();return;
  }
  const done=await adminRequest({action:'reset'},'Could not reset the votes. Please try again.');
  if(done){confirmingReset=false;setStatus('All votes have been reset.');showReset()}
});
resetCancel.addEventListener('click',()=>{confirmingReset=false;setStatus('');showReset();resetButton.focus()});
document.getElementById('settings-close').addEventListener('click',()=>settings.close());
settings.addEventListener('close',()=>{passcodeInput.value='';confirmingReset=false});
window.addEventListener('keydown',event=>{
  if(!(event.metaKey||event.ctrlKey)||!event.shiftKey||event.altKey||event.key.toLowerCase()!=='u')return;
  event.preventDefault();if(event.repeat)return;
  if(settings.open)settings.close();else void openSettings();
},true);

render();void refresh(true);
</script>
</body>
</html>
